name: Monthly upstream sync and CHD build

# On the 1st of every month (03:23 UTC), and whenever it is run by hand:
#
#   1. libretro is made identical to the libretro branch of WizzardSK/xemu-libretro;
#   2. that is merged into chd-support, which is pushed;
#   3. chd-support is built, by starting libretro.yml on it.
#
# This file lives on chd-support, which has to be the repository's default
# branch: scheduled workflows run from the default branch only, and so does the
# workflow_dispatch that starts libretro.yml. libretro itself can not hold it,
# as step 1 would delete it.
#
# One-time setup: a personal access token in the secret SYNC_TOKEN (Settings >
# Secrets and variables > Actions), because the job's own token may not push a
# commit that changes .github/workflows, which a merge of upstream does sooner
# or later. A fine-grained token for this repository only, with Contents and
# Workflows set to Read and write, is enough.
#
# A merge that conflicts stops the job (nothing is pushed to chd-support), names
# the files in the run's summary, and GitHub mails the failed run.

on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, as libretro.yml takes them: comma-separated (linux, windows, android, macos), or all'
        type: string
        default: windows
      build:
        description: 'Build chd-support after the merge'
        type: boolean
        default: true

concurrency:
  group: monthly-chd-build
  cancel-in-progress: false

permissions:
  contents: read   # the pushes use SYNC_TOKEN
  actions: write   # to start libretro.yml

env:
  UPSTREAM_REPO: WizzardSK/xemu-libretro
  UPSTREAM_BRANCH: libretro
  MIRROR_BRANCH: libretro
  FEATURE_BRANCH: chd-support
  BUILD_WORKFLOW: libretro.yml

jobs:
  sync:
    name: Sync libretro, merge it into chd-support, build
    runs-on: ubuntu-latest
    steps:
      - name: Check that SYNC_TOKEN is set
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error title=SYNC_TOKEN is not set::Add a personal access token (Contents and Workflows: read and write, for this repository) as the repository secret SYNC_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Make the mirror branch identical to upstream
        id: mirror
        run: |
          up=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          mine=$(git rev-parse "origin/${MIRROR_BRANCH}")
          echo "upstream=$up" >> "$GITHUB_OUTPUT"
          {
            echo "### ${MIRROR_BRANCH}"
            echo "${UPSTREAM_REPO} ${UPSTREAM_BRANCH} is at \`${up:0:10}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$up" = "$mine" ]; then
            echo "${MIRROR_BRANCH} is already identical." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Commits of the fork's own on the mirror go with the reset: say which
          if [ "$(git rev-list --count "$up..$mine")" != 0 ]; then
            echo "::warning title=${MIRROR_BRANCH} had commits that upstream does not have::They are replaced; the run's summary lists them."
            {
              echo
              echo "Replaced (not in upstream), as \`git branch rescue <sha>\` can still bring them back for a while:"
              git log --format='- %h %s' "$up..$mine"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          git push --force origin "$up:refs/heads/${MIRROR_BRANCH}"
          echo "${MIRROR_BRANCH} was at \`${mine:0:10}\`, now at \`${up:0:10}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Merge upstream into the feature branch
        id: merge
        env:
          UP: ${{ steps.mirror.outputs.upstream }}
        run: |
          echo "### ${FEATURE_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "${FEATURE_BRANCH} already has upstream \`${UP:0:10}\`." >> "$GITHUB_STEP_SUMMARY"
          elif git merge --no-ff -m "Merge ${UPSTREAM_REPO} ${UPSTREAM_BRANCH} (${UP:0:10})" "$UP"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "Upstream \`${UP:0:10}\` merged into ${FEATURE_BRANCH}: \`$(git rev-parse --short HEAD)\`." >> "$GITHUB_STEP_SUMMARY"
          else
            files=$(git diff --name-only --diff-filter=U)
            git merge --abort
            {
              echo "**Upstream \`${UP:0:10}\` does not merge into ${FEATURE_BRANCH}**: conflicts in"
              echo '```'
              echo "$files"
              echo '```'
              echo "Nothing was pushed to ${FEATURE_BRANCH}. Merge ${MIRROR_BRANCH} into it by hand, then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Upstream does not merge into ${FEATURE_BRANCH}::Conflicts in: $(echo "$files" | tr '\n' ' ')"
            exit 1
          fi

      - name: Push the feature branch
        if: steps.merge.outputs.merged == 'true'
        run: git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"

      - name: Build the feature branch
        if: github.event_name != 'workflow_dispatch' || inputs.build
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms || 'windows' }}
        run: |
          gh workflow run "$BUILD_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH" -f platforms="$PLATFORMS"
          {
            echo "### Build"
            echo "\`${BUILD_WORKFLOW}\` was started on ${FEATURE_BRANCH} for: ${PLATFORMS}."
            echo "Its runs and artifacts: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/${BUILD_WORKFLOW}"
          } >> "$GITHUB_STEP_SUMMARY"
